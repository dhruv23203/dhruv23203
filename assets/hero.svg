<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.58" stop-color="#111A28"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="135" y1="85" x2="895" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(940 160) rotate(180) scale(330 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6FEB" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#30363D" stroke-opacity="0.28"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="#30363D" stroke-width="2"/>

  <circle cx="1000" cy="90" r="115" fill="#1F6FEB" fill-opacity="0.08" filter="url(#soft)"/>
  <circle cx="1060" cy="235" r="80" fill="#7C3AED" fill-opacity="0.09" filter="url(#soft)"/>

  <g opacity="0.78">
    <path d="M905 92L1020 135L955 225L1080 270" stroke="#58A6FF" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M955 225L1120 165" stroke="#7C3AED" stroke-opacity="0.34" stroke-width="2"/>
    <circle cx="905" cy="92" r="6" fill="#58A6FF"/>
    <circle cx="1020" cy="135" r="6" fill="#58A6FF"/>
    <circle cx="955" cy="225" r="6" fill="#7C3AED"/>
    <circle cx="1080" cy="270" r="6" fill="#58A6FF"/>
    <circle cx="1120" cy="165" r="6" fill="#7C3AED"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="72" y="55" width="222" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <circle cx="94" cy="72" r="5" fill="#3FB950">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="109" y="77" fill="#C9D1D9" font-size="14" font-weight="600" letter-spacing="0.8">OPEN TO SDE &amp; AI ROLES</text>

    <text x="72" y="155" fill="#F0F6FC" font-size="54" font-weight="750" letter-spacing="-1.5">Dhruv Malhan</text>
    <rect x="72" y="178" width="620" height="4" rx="2" fill="url(#accent)"/>

    <text x="72" y="225" fill="#C9D1D9" font-size="25" font-weight="600">Software Engineering · AI Systems · Backend Development</text>
    <text x="72" y="266" fill="#8B949E" font-size="18">B.Tech in Computer Science &amp; Applied Mathematics — IIIT Delhi</text>
    <text x="72" y="304" fill="#8B949E" font-size="17">Building reliable, intelligent products from architecture to user experience.</text>

    <text x="930" y="326" fill="#58A6FF" font-size="15" font-weight="650" letter-spacing="1.2">CODE • DESIGN • SHIP</text>
  </g>
